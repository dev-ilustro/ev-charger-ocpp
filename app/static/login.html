<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ - OCPP 1.6J Central System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-topbar">⚡ OCPP Central</div>

    <div class="auth-main">
      <div class="auth-card">
        <h2>เข้าสู่ระบบ</h2>
        <form id="login-form" class="form-grid">
          <label>Username
            <input type="text" id="login-username" required autocomplete="username" />
          </label>
          <label>Password
            <input type="password" id="login-password" required autocomplete="current-password" />
          </label>
          <p id="login-error" class="form-error" style="display:none"></p>
          <button type="submit">เข้าสู่ระบบ</button>
        </form>
        <p class="auth-footer-link">
          ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a>
        </p>
      </div>
    </div>

    <footer class="page-footer">
      Powered by EV Ilustro v1.0
    </footer>
  </div>

  <script src="login.js"></script>
</body>
</html>
